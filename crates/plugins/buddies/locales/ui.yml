  glow_desc:
    en: Luminous tint of the AMOLED display eyes across all sidebar NOMI avatars.
    zh-CN: 设置左侧所有 NOMI 头像屏幕内眼神的发光色彩。
  glow_white:
    en: Factory White
    zh-CN: 原厂冷白
  glow_amber:
