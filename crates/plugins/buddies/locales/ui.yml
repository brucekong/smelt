  cyber_optics_desc:
    en: Control when NOMI switches to character-specific mechanical optic eyes (or stays pure monochrome).
    zh-CN: 控制 NOMI 何时启用角色专属赛博机械眼眸，或保留原厂纯色极简线条眼。
